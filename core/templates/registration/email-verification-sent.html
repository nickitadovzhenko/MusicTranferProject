{% extends "base.html" %}
{% block title %}Check Your Email – Streamify{% endblock %}
{% block content %}
<div class="page-sm" style="text-align:center;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">📬</div>
    <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:0.75rem;">Check your inbox</h1>
    <p style="color:var(--text-muted); margin-bottom:2rem; line-height:1.6;">
        We sent a verification link to your email address. Please click it to activate your account.
    </p>
    <a href="{% url 'my-login' %}" class="btn btn-ghost">Back to Login</a>
</div>
{% endblock %}
