{% include "base.html" %}
{% load static %}
{% block content %}

<div class="container mt-5">
    <div class="row">
        <!-- First Column -->
        <div class="col-md-6">
            <div class="mb-3">
                <label for="sourcePlatform" class="form-label">Choose from what platform would you like to transfer your playlists</label>
                <select id="sourcePlatform" class="form-select">
                    <option value="spotify">Spotify</option>
                    <option value="youtube">YouTube</option>
                </select>
            </div>
        </div>
        <!-- Second Column -->
        <div class="col-md-6">
            <div class="mb-3">
                <label for="destinationPlatform" class="form-label">Choose to what platform would you like to transfer your playlists</label>
                <select id="destinationPlatform" class="form-select">
                    <option value="spotify">Spotify</option>
                    <option value="youtube">YouTube</option>
                </select>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-12 text-center">
            <a id="transferButton" class="btn btn-success btn-lg" href="{% url 'get_playlists' %}">TRANSFER</a>
        </div>
    </div>
</div>

<script>
    function updateTransferButton() {
        const sourcePlatform = document.getElementById('sourcePlatform').value;
        const destinationPlatform = document.getElementById('destinationPlatform').value;
        const transferButton = document.getElementById('transferButton');
        
        if (sourcePlatform === 'spotify' && destinationPlatform === 'youtube') {
            transferButton.href = "{% url 'get_playlists' %}";
            transferButton.classList.remove('disabled');
        } else if (sourcePlatform === 'youtube' && destinationPlatform === 'spotify') {
            transferButton.href = "{% url 'get_playlists_youtube' %}";
            transferButton.classList.remove('disabled');
        } else if (sourcePlatform === 'spotify' && destinationPlatform === 'spotify') {
            transferButton.href = "{% url 'get_playlists_s2s' %}";
            transferButton.classList.remove('disabled');
        } else {
            // YouTube to YouTube is not supported yet
            transferButton.href = "#";
            transferButton.classList.add('disabled');
        }
    }

    // Bind the new function to the onchange events
    document.getElementById('sourcePlatform').onchange = updateTransferButton;
    document.getElementById('destinationPlatform').onchange = updateTransferButton;

    // Call the functions once on page load to set the initial state correctly
    window.onload = function() {
        updateTransferButton();
    };
</script>

{% endblock content %}
